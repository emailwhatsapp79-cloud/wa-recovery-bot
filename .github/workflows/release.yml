# Every push to main builds a ready-to-run bundle (code + node_modules) and publishes it as a release.
# The server's auto-update script downloads the newest release and restarts the app.
# Building here is needed because the server has no git, which one WhatsApp library needs to install.
name: Build release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install production packages
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Syntax check
        run: npm run check
      - name: Drop the optional image library (not used, saves ~45 MB)
        run: rm -rf node_modules/sharp node_modules/@img
      - name: Smoke test (server boots and serves the landing page)
        run: |
          mkdir -p /tmp/smoke
          DATA_DIR=/tmp/smoke PORT=8099 node server.js > /tmp/smoke.log 2>&1 &
          for i in $(seq 1 20); do curl -fs -o /dev/null http://127.0.0.1:8099/ && break; sleep 1; done
          curl -fs -o /dev/null http://127.0.0.1:8099/ || (cat /tmp/smoke.log; exit 1)
          kill %1 || true
      - name: Bundle
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          echo "$TAG" > .release-tag
          tar czf wa-multi.tar.gz .release-tag package.json package-lock.json README.md server.js src scripts node_modules
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          ls -lh wa-multi.tar.gz
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" wa-multi.tar.gz --target "$GITHUB_SHA" \
            --title "$TAG" --notes "$(git log -1 --pretty=%s)"
          # keep only the newest 10 builds
          gh release list --limit 100 --json tagName --jq '.[10:][].tagName' | while read -r t; do
            gh release delete "$t" --yes --cleanup-tag || true
          done
